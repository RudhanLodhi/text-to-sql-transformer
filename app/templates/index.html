<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Text-to-SQL Transformer</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=3">
</head>

<body>
    <main class="shell">
        <header>
            <p class="eyebrow">TEXT-TO-SQL TRANSFORMER</p>
            <h1>Generate SQL</h1>
            <p class="intro">Ask a question about your table and provide its column names.</p>
        </header>

        <section class="panel">
            <label for="question">Question</label>
            <textarea id="question" placeholder="Example: What is the maximum age?"></textarea>
            <label for="columns">Column names</label>
            <textarea id="columns" class="columns" placeholder="name, age, city"></textarea>
            <div class="actions">
                <button id="generate" class="primary" type="button">Generate SQL</button>
            </div>
            <p id="status" class="status" role="status"></p>
        </section>

        <section class="results" aria-live="polite">
            <article class="result-card accent-red">
                <div class="result-heading"><span>GREEDY SEARCH</span><small>beam = 1</small></div>
                <div class="prediction">
                    <div><h2>SQL</h2><pre id="greedy-sql">SQL will appear here</pre></div>
                    <div><h2>Parsed query</h2><pre id="greedy-query">Parsed query will appear here</pre></div>
                </div>
            </article>
            <article class="result-card accent-green">
                <div class="result-heading"><span>BEAM SEARCH</span><small>beam = 4</small></div>
                <div class="prediction">
                    <div><h2>SQL</h2><pre id="beam-sql">SQL will appear here</pre></div>
                    <div><h2>Parsed query</h2><pre id="beam-query">Parsed query will appear here</pre></div>
                </div>
            </article>
        </section>
    </main>
    <script src="{{ url_for('static', path='app.js') }}?v=2"></script>
</body>

</html>
